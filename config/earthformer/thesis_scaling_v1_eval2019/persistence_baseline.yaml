# Persistence baseline: same 2019 rainy test population as EarthFormer eval.
dataloader:
  module_path: nowcasting.data.dataloader_zarrv3.NowcastingDataModule
  paths:
  - ${oc.env:THESIS_DATA_ROOT}/radar_2008_2019_radar_only_v1.zarr
  var_info:
    sample_var: radar/max_intensity_grid
    latlon: false
    in_vars:
    - radar/rtcor
    out_vars:
    - radar/rtcor
    transforms:
      radar:
        default_rainrate:
          mean: 0.03019706713265408
          std: 0.5392297631902654
  split_info:
    split_rules:
      val:
        year:
        - 2019
      train:
        year:
        - 2008
        - 2009
        - 2010
        - 2011
        - 2012
        - 2013
        - 2014
        - 2015
        - 2016
        - 2017
    apply_missing_masks:
    - radar
    clutter_threshold: 50
  sample_info:
    threshold: 0.01
    methods:
      train:
        agg: mean_pool
        center_crop: true
      val:
        agg: mean_pool
        center_crop: true
    index_files:
      train: ${oc.env:THESIS_INDEX_DIR}/train_100pct.npz
      val: ${oc.env:THESIS_INDEX_DIR}/test_2019.npz
  context_len: 4
  forecast_len: 18
  img_size:
  - 8
  - 8
  stride:
  - 4
  - 1
  - 1
  batch_size: 16
  num_workers: 4
model:
  module_path: nowcasting.benchmarks.persistence.PersistenceModel
  future_timesteps: 18
  inputs_are_normalized: true
eval:
  model_name: thesis_baseline__persistence__test2019
  num_samples: 32000
  leadtimes: [5, 10, 15, 30, 60, 90]
  thresholds: [0, 0.5, 1, 2, 5, 10, 20, 30]
  save_dir: ./results
  eval_subdir: evaluations
